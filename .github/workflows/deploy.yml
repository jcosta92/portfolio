name: Deploy to GitHub Pages

# Builds the site on GitHub and publishes the result directly, so a push to
# master is all that is needed. Nothing built is committed to the repository.
#
# Requires Settings → Pages → Source to be set to "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # react-scripts turns ESLint warnings into build errors when CI=true,
          # which Actions sets by default. Publishing should not be blocked by
          # an unused import — the Node.js CI workflow still fails on warnings,
          # so they stay visible without taking the live site down.
          CI: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
